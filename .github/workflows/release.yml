# Builds CACalm installers for Windows, macOS and Linux.
#
# - Push a tag like `v0.1.2` → builds everything and attaches the installers
#   to a *draft* GitHub Release (publish it manually after testing).
# - Run manually (Actions → Release → Run workflow) → builds and uploads the
#   installers as workflow artifacts only.
#
# The frontend depends on the sibling repo `cecepazhar/caui`. If that repo is
# private, add a repository secret `CAUI_TOKEN` (fine-grained, read-only
# "Contents" access to caui).

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (NSIS)
            platform: windows-latest
            rust_targets: ''
            args: '--bundles nsis'
          - name: macOS (Apple Silicon)
            platform: macos-latest
            rust_targets: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin --bundles dmg'
          - name: macOS (Intel)
            platform: macos-latest
            rust_targets: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin --bundles dmg'
          - name: Linux (deb + AppImage)
            platform: ubuntu-22.04
            rust_targets: ''
            args: '--bundles deb,appimage'
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout CACalm
        uses: actions/checkout@v4
        with:
          path: cacalm

      - name: Checkout CAUI (design system)
        uses: actions/checkout@v4
        with:
          repository: cecepazhar/caui
          path: caui
          token: ${{ secrets.CAUI_TOKEN || github.token }}

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: cacalm

      - name: Install CAUI dependencies
        working-directory: caui
        run: npm install --no-audit --no-fund

      - name: Install & build frontend
        working-directory: cacalm/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: cacalm
          tauriScript: npx --prefix frontend tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: CACalm ${{ github.ref_name }}
          releaseBody: |
            CACalm — free calm & focus soundscapes for Windows, macOS and Linux.
            Made by Cecep Azhar · Fathforce.

            • Windows: download the `*-setup.exe`
            • macOS: `aarch64` = Apple Silicon, `x64` = Intel
            • Linux: `.deb` (Debian/Ubuntu) or `.AppImage` (any distro)
          releaseDraft: true

      - name: Upload installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cacalm-${{ matrix.platform }}-${{ matrix.rust_targets || 'native' }}
          path: |
            cacalm/target/release/bundle/nsis/*.exe
            cacalm/target/release/bundle/deb/*.deb
            cacalm/target/release/bundle/appimage/*.AppImage
            cacalm/target/*/release/bundle/dmg/*.dmg
          if-no-files-found: ignore
