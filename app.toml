[app]
name = "CACalm"
slug = "cacalm"
bundle_id = "com.fathforce.cacalm"
version = "0.1.4"
accent_color = "teal"
error_prefix = "CALM"
description = "Free calm app — ambient soundscapes, binaural beats, breathing guides & focus timer."
brand = "CACalm"

[window]
title = "CACalm"
width = 1100
height = 760
min_width = 360
min_height = 500

[modules]
timer_enabled = true
ambient_enabled = true
library_enabled = true
preset_enabled = true

[[menus]]
key = "mixer"
label = "Ambient Mixer"
href = "/"
icon = "headphones"
description = "Free calm app — ambient soundscapes, binaural beats, breathing guides & focus timer."

[[menus]]
key = "timer"
label = "Focus Timer"
href = "/timer"
icon = "clock"
description = "Free calm app — ambient soundscapes, binaural beats, breathing guides & focus timer."

[[menus]]
key = "library"
label = "Sound Library"
href = "/library"
icon = "disc"
description = "Free calm app — ambient soundscapes, binaural beats, breathing guides & focus timer."

[[menus]]
key = "settings"
label = "Settings"
href = "/settings"
icon = "settings"
description = "Free calm app — ambient soundscapes, binaural beats, breathing guides & focus timer."
