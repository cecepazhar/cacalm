[package]
name = "calm-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CACalm core library — multi-channel ambient audio engine, Pomodoro focus timer, local sound library & preset storage."

[lib]
name = "calm_core"
path = "src/lib.rs"

[features]
default = ["audio"]
# Real audio playback via `rodio`/`cpal`; on Linux requires ALSA dev headers
# (`alsa-lib-devel` / `libasound2-dev`). Kept as an opt-in fallback.
audio = ["dep:rodio", "dep:cpal"]
# Compiles the pure logic (timer, library, presets) without any audio backend.
stub-audio = []

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
directories.workspace = true
chrono.workspace = true
uuid.workspace = true
rusqlite.workspace = true
tokio.workspace = true
parking_lot.workspace = true
sha2.workspace = true
hmac.workspace = true
hex.workspace = true
rodio = { version = "0.20", default-features = false, features = ["wav", "vorbis", "flac"], optional = true }
cpal = { version = "0.15", optional = true }