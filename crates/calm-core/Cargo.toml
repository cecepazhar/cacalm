[package]
name = "calm-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CACalm core library — multi-channel ambient audio engine, Pomodoro focus timer, local sound library & preset storage."

[lib]
name = "calm_core"
path = "src/lib.rs"

[features]
default = ["stub-audio"]
# Real audio playback requires system audio headers (alsa-lib-devel on Fedora).
# Enable with `--features audio` once libasound2-dev/alsa-lib-devel is installed.
audio = ["dep:rodio", "dep:cpal"]
# Compiles the pure logic (timer, library, presets) without any audio backend.
stub-audio = []

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
directories.workspace = true
chrono.workspace = true
uuid.workspace = true
rusqlite.workspace = true
tokio.workspace = true
parking_lot.workspace = true
rodio = { version = "0.20", default-features = false, optional = true }
cpal = { version = "0.15", optional = true }